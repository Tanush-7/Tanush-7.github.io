/* ============ utilities (same conventions as the Phase I tool) ============ */
const ri=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const pick=e=>e[Math.floor(Math.random()*e.length)];
const shuffle=e=>{let t=e.slice();for(let s=t.length-1;s>0;s--){let n=Math.floor(Math.random()*(s+1));[t[s],t[n]]=[t[n],t[s]]}return t};
const rupee=e=>"₹"+Math.round(e).toLocaleString("en-IN");
const num=e=>{let v=Math.round(e*100)/100;return String(v)};
const LETTERS=["A","B","C","D"];
/* Question builder: guarantees 4 distinct options with exactly one correct. */
function mkq(topic,variant,text,correct,distractors,fmt,hint,steps){
  fmt=fmt||(x=>String(x));
  const cStr=fmt(correct), seen=new Set([cStr]), ds=[];
  for(const dRaw of (distractors||[])){
    const s=fmt(dRaw);
    if(!seen.has(s)&&s!==""&&s!=null){seen.add(s);ds.push(s)}
  }
  let guard=0;
  while(ds.length<3&&guard++<60){
    let cand=null;
    if(typeof correct==="number"&&isFinite(correct)){
      const delta=pick([1,-1,2,-2,5,-5,10,-10,Math.max(1,Math.round(Math.abs(correct)*0.1)),-Math.max(1,Math.round(Math.abs(correct)*0.1)),Math.max(2,Math.round(Math.abs(correct)*0.25))]);
      cand=fmt(correct+delta);
    } else {
      break;
    }
    if(!seen.has(cand)){seen.add(cand);ds.push(cand)}
  }
  if(ds.length<3) throw new Error("mkq: not enough distinct distractors for "+variant);
  const options=shuffle([cStr,...ds.slice(0,3)]);
  return {id:Math.random().toString(36).slice(2,10),topic,variant,text,options,answer:options.indexOf(cStr),hint:hint||"",steps:steps||[],correctText:cStr};
}
/* Bank question: options given as strings, answer is the correct string. */
function bkq(topic,variant,text,correct,distractors,hint,steps){
  return mkq(topic,variant,text,correct,distractors,x=>x,hint,steps);
}
function collect(fn,n,maxTries){
  const out=[],seen=new Set();let tries=0;
  while(out.length<n&&tries++<(maxTries||n*60)){
    try{const q=fn();if(q&&!seen.has(q.text)){seen.add(q.text);out.push(q)}}catch(e){/* skip failed generation */}
  }
  return out;
}
function collectFromSets(setFn,n,maxTries){
  const out=[],seen=new Set();let tries=0;
  while(out.length<n&&tries++<(maxTries||40)){
    let s=[];try{s=setFn()||[]}catch(e){s=[]}
    for(const q of s){if(out.length<n&&q&&!seen.has(q.text)){seen.add(q.text);out.push(q)}}
  }
  return out;
}
const MALE=["Aarav","Rohan","Kabir","Vikram","Arjun","Nikhil","Rahul","Sameer","Varun","Kunal","Deepak","Manoj"];
const FEMALE=["Priya","Ananya","Kavya","Meera","Divya","Sneha","Pooja","Ritu","Neha","Lakshmi","Aisha","Tara"];
const PEOPLE=[...MALE,...FEMALE];

/* ============ REASONING generators ============ */
/* --- linear arrangement engine (floors / boxes / days), solver-verified unique --- */
function permsOf(arr){
  if(arr.length<=1) return [arr.slice()];
  const out=[];
  for(let i=0;i<arr.length;i++){
    const rest=arr.slice(0,i).concat(arr.slice(i+1));
    for(const p of permsOf(rest)) out.push([arr[i],...p]);
  }
  return out;
}
const PERMS7=permsOf([0,1,2,3,4,5,6]);
const SKINS={
  floor:{
    intro:p=>`Seven people — ${p.join(", ")} — live on the seven floors of a building, numbered 1 (ground) to 7 (top). Each lives on a different floor.`,
    atPos:(n,l)=>`${n} lives on floor ${l+1}`,
    above1:(hi,lo)=>`${hi} lives immediately above ${lo}`,
    aboveAny:(hi,lo)=>`${hi} lives somewhere above ${lo}`,
    between:(a,b,k)=>`${k} person${k===1?" lives":"s live"} between ${a} and ${b}`,
    notAt:(n,l)=>`${n} does not live on floor ${l+1}`,
    parity:(n,even)=>`${n} lives on an ${even?"even":"odd"}-numbered floor`,
    whoQ:l=>`Who lives on floor ${l+1}?`,
    levelQ:n=>`On which floor does ${n} live?`,
    levelName:l=>`Floor ${l+1}`,
    betweenQ:(a,b)=>`How many persons live between ${a} and ${b}?`,
    aboveQ:n=>`Who lives immediately above ${n}?`,
    topQ:()=>`Who lives on the topmost floor?`,
    posWord:l=>`floor ${l+1}`
  },
  box:{
    intro:p=>`Seven boxes, each belonging to one of ${p.join(", ")}, are stacked one above the other. Each person owns exactly one box. Positions are counted from the bottom (1) to the top (7).`,
    atPos:(n,l)=>`The box of ${n} is at position ${l+1} from the bottom`,
    above1:(hi,lo)=>`The box of ${hi} is kept immediately above the box of ${lo}`,
    aboveAny:(hi,lo)=>`The box of ${hi} is kept somewhere above the box of ${lo}`,
    between:(a,b,k)=>`${k} box${k===1?" is":"es are"} kept between the boxes of ${a} and ${b}`,
    notAt:(n,l)=>`The box of ${n} is not at position ${l+1} from the bottom`,
    parity:null,
    whoQ:l=>`Whose box is at position ${l+1} from the bottom?`,
    levelQ:n=>`At which position from the bottom is the box of ${n}?`,
    levelName:l=>`Position ${l+1}`,
    betweenQ:(a,b)=>`How many boxes are kept between the boxes of ${a} and ${b}?`,
    aboveQ:n=>`Whose box is kept immediately above the box of ${n}?`,
    topQ:()=>`Whose box is at the top of the stack?`,
    posWord:l=>`position ${l+1}`
  },
  row:{
    intro:p=>`Seven people — ${p.join(", ")} — sit in a straight row of seven seats, numbered 1 to 7 from the left. Each sits on a different seat and all face north.`,
    atPos:(n,l)=>`${n} sits on seat ${l+1}`,
    above1:(hi,lo)=>`${hi} sits immediately to the right of ${lo}`,
    aboveAny:(hi,lo)=>`${hi} sits somewhere to the right of ${lo}`,
    between:(a,b,k)=>`${k} person${k===1?" sits":"s sit"} between ${a} and ${b}`,
    notAt:(n,l)=>`${n} does not sit on seat ${l+1}`,
    parity:null,
    whoQ:l=>`Who sits on seat ${l+1}?`,
    levelQ:n=>`On which seat does ${n} sit?`,
    levelName:l=>`Seat ${l+1}`,
    betweenQ:(a,b)=>`How many persons sit between ${a} and ${b}?`,
    aboveQ:n=>`Who sits immediately to the right of ${n}?`,
    topQ:()=>`Who sits on the rightmost seat?`,
    posWord:l=>`seat ${l+1}`
  }
};
function linearPuzzleSet(skinKey){
  const skin=SKINS[skinKey];
  for(let attempt=0;attempt<80;attempt++){
    const persons=shuffle(PEOPLE).slice(0,7);
    const truth=shuffle([0,1,2,3,4,5,6]); /* truth[personIdx]=level */
    const pos=p=>truth[p];
    const cluePool=[];
    const addClue=(text,test)=>cluePool.push({text,test});
    for(const p of shuffle([0,1,2,3,4,5,6]).slice(0,3))
      addClue(skin.atPos(persons[p],pos(p))+".",q=>q[p]===pos(p));
    const pairs=shuffle([[0,1],[2,3],[4,5],[1,4],[0,6],[3,5],[2,6],[1,2],[3,4],[5,6],[0,3],[2,5]]);
    for(const [a,b] of pairs){
      const kind=ri(0,3);
      if(kind===0&&(pos(a)===pos(b)+1||pos(b)===pos(a)+1)){
        const hi=pos(a)>pos(b)?a:b, lo=hi===a?b:a;
        addClue(skin.above1(persons[hi],persons[lo])+".",q=>q[hi]===q[lo]+1);
      } else if(kind===1){
        const k=Math.abs(pos(a)-pos(b))-1;
        if(k>=1) addClue(skin.between(persons[a],persons[b],k)+".",q=>Math.abs(q[a]-q[b])-1===k);
      } else if(kind===2&&pos(a)!==pos(b)){
        const hi=pos(a)>pos(b)?a:b, lo=hi===a?b:a;
        addClue(skin.aboveAny(persons[hi],persons[lo])+".",q=>q[hi]>q[lo]);
      } else if(kind===3){
        const l=ri(0,6); if(l!==pos(a)) addClue(skin.notAt(persons[a],l)+".",q=>q[a]!==l);
      }
    }
    if(skin.parity){ const pp=ri(0,6), par=(pos(pp)+1)%2===0;
      addClue(skin.parity(persons[pp],par)+".",q=>((q[pp]+1)%2===0)===par); }
    const shuffledClues=shuffle(cluePool);
    let chosen=[], sols=null;
    for(const c of shuffledClues){
      chosen.push(c);
      sols=PERMS7.filter(arr=>{const posOf=[];arr.forEach((person,level)=>posOf[person]=level);return chosen.every(cl=>cl.test(posOf))});
      if(sols.length===1) break;
    }

/* --- circular seating, solver-verified --- */
const PERMS6=permsOf([1,2,3,4,5,6]);
function circularPuzzleSet(){
  for(let attempt=0;attempt<60;attempt++){
    const persons=shuffle(PEOPLE).slice(0,7);
    /* seatOf[person]; person 0 fixed at seat 0 to break rotation. Seats increase clockwise; facing centre, left = +1 seat. */
    const truth=[0,...shuffle([1,2,3,4,5,6])];
    const seatOf=[]; truth.forEach((person,seat)=>seatOf[person]=seat);
    const left=(s,k)=>((s+k)%7+7)%7, right=(s,k)=>((s-k)%7+7)%7;
    const personAtSeat=s=>truth[s];
    const clues=[];

    for(let a=0;a<7;a++)for(let b=0;b<7;b++){
      if(a===b) continue;
      if(seatOf[a]===left(seatOf[b],2)) cand.push({text:`${persons[a]} sits second to the left of ${persons[b]}.`,test:s=>s[a]===left(s[b],2)});
      if(seatOf[a]===right(seatOf[b],2)) cand.push({text:`${persons[a]} sits second to the right of ${persons[b]}.`,test:s=>s[a]===right(s[b],2)});
      if(seatOf[a]===left(seatOf[b],3)) cand.push({text:`${persons[a]} sits third to the left of ${persons[b]}.`,test:s=>s[a]===left(s[b],3)});

    }

    let chosen=[],sols=null;

      chosen.push(c);

      if(sols.length===1) break;
    }
    if(!sols||sols.length!==1||chosen.length<5) continue;
    const solSeat=[]; sols[0].forEach((person,seat)=>solSeat[person]=seat);
    const intro=`Seven people — ${persons.join(", ")} — sit around a circular table, all facing the centre.\n\n${chosen.map(c=>c.text).join("\n")}`;
    const qs=[];
    const qp=shuffle([0,1,2,3,4,5,6]);
    { const p=qp[0], ans=persons[personAtSeat(left(solSeat[p],1))];
      qs.push(bkq("reasoning:puzzle","circ-left",`${intro}\n\nWho sits to the immediate left of ${persons[p]}?`,ans,persons.filter(x=>x!==ans).slice(0,5),"Facing the centre, left means one seat clockwise in the diagram.",[`Next to ${persons[p]} on the left is ${ans}.`])); }
    { const p=qp[1], ans=persons[personAtSeat(right(solSeat[p],2))];
      qs.push(bkq("reasoning:puzzle","circ-right2",`${intro}\n\nWho sits second to the right of ${persons[p]}?`,ans,persons.filter(x=>x!==ans).slice(0,5),"Count two seats to the right.",[`Two seats to the right of ${persons[p]} is ${ans}.`])); }
    { const p=qp[2], l=persons[personAtSeat(left(solSeat[p],1))], r=persons[personAtSeat(right(solSeat[p],1))];
      qs.push(bkq("reasoning:puzzle","circ-between",`${intro}\n\nWho sits exactly between ${l} and ${r}?`,persons[p],persons.filter(x=>x!==persons[p]).slice(0,5),"Find the person whose two neighbours are the two named people.",[`${persons[p]} has ${l} on one side and ${r} on the other.`])); }
    { const p=qp[3], ans=persons[personAtSeat(left(solSeat[p],3))];
      qs.push(bkq("reasoning:puzzle","circ-left3",`${intro}\n\nWho sits third to the left of ${persons[p]}?`,ans,persons.filter(x=>x!==ans).slice(0,5),"Count three seats to the left.",[`Three seats to the left of ${persons[p]} is ${ans}.`])); }
    { const p=qp[4], q2=qp[5], areN=(Math.abs(solSeat[p]-solSeat[q2])===1||Math.abs(solSeat[p]-solSeat[q2])===6);
      const ans=areN?`${persons[p]} and ${persons[q2]} are immediate neighbours`:`${persons[p]} and ${persons[q2]} are not immediate neighbours`;

      const falseStmts=[];

        if(x===y) continue;
        const nb=(Math.abs(solSeat[x]-solSeat[y])===1||Math.abs(solSeat[x]-solSeat[y])===6);

    if(qs.length===5) return qs;
  }

function genDirection(){
  const triples=[[3,4,5],[6,8,10],[5,12,13],[9,12,15],[8,15,17]];
  const [tx,ty,d]=pick(triples);
  const sx=pick([1,-1]), sy=pick([1,-1]);
  const name=pick(PEOPLE);
  /* path: north/south leg then east/west leg then a partial return leg, ending at (sx*tx, sy*ty) */
  const a=ty+ri(2,6), b=tx, c=a-ty;

    `${name} walks ${a} km towards the ${vDir}, then turns and walks ${b} km towards the ${hDir}, and finally walks ${c} km towards the ${vBack}.\n\nHow far is ${name} from the starting point, and in which direction?`,

    [`Net north-south movement: ${a} − ${c} = ${Math.abs(dy)} km towards the ${vDir}.`,`Net east-west movement: ${b} km towards the ${hDir}.`,`Distance = √(${Math.abs(dx)}² + ${Math.abs(dy)}²) = ${dist} km, towards the ${dirName(dx,dy)}.`]);

function ratioQ(topic,variant,text,male,female,hint,stepText){
  const g=gcd(male,female), a=male/g, b=female/g, correct=`${a} : ${b}`;
  const pool=[`${b} : ${a}`,`${a+1} : ${b}`,`${a} : ${b+1}`,`${a+1} : ${b+1}`,`${male/10} : ${female/10}`,`${a+2} : ${b}`,`${b+1} : ${a}`];
  const ds=[...new Set(pool)].filter(s=>s!==correct).slice(0,3);
  return bkq(topic,variant,text,correct,ds,hint,[stepText]);
}

  const correct=it.e<0?"No error":`Part (${"abc"[it.e]})`;
  return bkq("english:error","error",text,correct,["Part (a)","Part (b)","Part (c)","No error"].filter(x=>x!==correct),"Read each part separately and check agreement, tense and word choice.",[it.w]);

/* --- sentence rearrangement and para jumbles: order mechanics --- */
function orderQuestion(topic,variant,parts,instruction,why){
  const display=shuffle(parts.map((t,i)=>({t,i})));
  const labelOf={}; display.forEach((d,pos)=>labelOf[d.i]="ABCDE"[pos]);
  const correctSeq=parts.map((_,i)=>labelOf[i]).join(" ");
  const perms=new Set([correctSeq]);
  while(perms.size<4){const s=shuffle(display.map((_,pos)=>"ABCDE"[pos])).join(" ");perms.add(s)}
  const distractors=[...perms].filter(s=>s!==correctSeq);
  const shown=display.map((d,pos)=>`${"ABCDE"[pos]}: ${d.t}`).join("\n");
  return bkq(topic,variant,`${instruction}\n\n${shown}\n\nWhich is the correct order?`,correctSeq,distractors,"Find the opening part first, then follow the links between parts.",[why||`The correct order is ${correctSeq}: ${parts.join(" ")}`]);
}

function genNumericComputer(){
  const kind=ri(0,2);
  if(kind===0){const n=ri(5,63);const vs=new Set();while(vs.size<3){const v=ri(3,70);if(v!==n)vs.add(v)}
    return mkq("computer:memory","mem-binary",`What is the binary equivalent of decimal ${n}?`,n.toString(2),[...vs].map(v=>v.toString(2)),x=>x,"Divide by 2 repeatedly and read the remainders upward.",[`The binary equivalent of decimal ${n} is ${n.toString(2)}.`])}
  if(kind===1){const n=ri(9,31);const bin=n.toString(2);const vs=new Set();while(vs.size<3){const v=ri(2,40);if(v!==n)vs.add(v)}
    return mkq("computer:memory","mem-binary",`What is the decimal equivalent of binary ${bin}?`,n,[...vs],x=>String(x),"Multiply each bit by its place value (powers of 2) and add.",[`Binary ${bin} = ${n} in decimal.`])}
  const units=[["GB","MB",1024],["MB","KB",1024],["KB","bytes",1024],["TB","GB",1024]];
  const u=pick(units),k=pick([2,3,4,5,6,8,10]);
  return mkq("computer:memory","mem-units",`How many ${u[1]} are there in ${k} ${u[0]}?`,k*u[2],[k*1000,k*u[2]+1024,k*u[2]/2],x=>String(x),"Each step between these units multiplies by 1024.",[`${k} ${u[0]} = ${k} × 1024 = ${k*u[2]} ${u[1]}.`]);

/* Gatekeeping state machine: descriptive unlocks only when EVERY sectional target

function evalGate(scores,targets){
  const per={};let total=0,secPass=true;
  for(const s of CONFIG.sections){const v=scores[s.id];per[s.id]=v;
    if(v==null||v<targets[s.id])secPass=false;else total+=0;
    if(v!=null)total+=v;}

function el(tag,attrs,...kids){
  const n=document.createElement(tag);
  if(attrs)for(const k of Object.keys(attrs)){const v=attrs[k];if(v==null)continue;
    if(k==="class")n.className=v;else if(k==="text")n.textContent=v;
    else if(k.slice(0,2)==="on"&&typeof v==="function")n.addEventListener(k.slice(2),v);
    else n.setAttribute(k,v);}
  for(const kid of kids.flat(9)){if(kid==null||kid===false)continue;
    n.append(kid.nodeType?kid:document.createTextNode(String(kid)));}
  return n;

  for(const s of mock.sections){dAtt+=s.result.att-s.result.gAtt;dCor+=s.result.cor-s.result.gCor;gAtt+=s.result.gAtt;gCor+=s.result.gCor}
  const gNet=gCor-(gAtt-gCor)*CONFIG.negativePerWrong;
  const gg=el("div",{class:"group"});gg.append(el("p",{class:"label"},"Analytics"),el("h2",null,"Deliberate answers vs guesses"));
  gg.append(el("ul",{class:"rows"},
    el("li",null,el("span",null,"Deliberate attempts"),el("span",{class:"val"},dAtt+" attempted · "+(dAtt?Math.round(dCor/dAtt*100):0)+"% accuracy")),
    el("li",null,el("span",null,"Flagged guesses"),el("span",{class:"val"},gAtt+" attempted · "+gCor+" correct")),
    el("li",null,el("span",null,"Guess hit rate vs 20% break-even"),el("span",{class:"val"},gAtt?Math.round(gCor/gAtt*100)+"% · net "+(gNet>=0?"+":"")+fmtScore(gNet)+" marks":"—"))));
  gg.append(el("p",{class:"caption"},EV_TEXT));
  a.append(gg);
  /* review */
  const rg=el("div",{class:"group"});rg.append(el("p",{class:"label"},"Review"),el("h2",null,"Every question, with solutions"));
  mock.sections.forEach((s,si)=>{
    rg.append(el("p",{class:"label"},s.def.name));
    s.qs.forEach((q,qi)=>{
      const sel=s.ans[qi],ok=sel!=null&&sel===q.answer;
      const det=el("details",{class:"review"});
      const sum=el("summary",null,el("span",{class:"dot "+(sel==null?"":ok?"ok":"bad")}),
        el("span",null,"Q"+(qi+1)+(s.guess.has(qi)?" · flagged guess":"")+" — "+q.text.split("\n")[0].slice(0,90)));
      det.append(sum);
      det.append(el("p",{class:"qtext"},q.text));
      const opts=el("div",{class:"opts"});
      q.options.forEach((opt,i)=>{let cls="opt";if(i===q.answer)cls+=" right";else if(i===sel)cls+=" wrong";
        opts.append(el("button",{class:cls,disabled:""},LETTERS[i]+". "+opt));});
      det.append(opts);
      det.append(el("p",null,sel==null?"Not attempted. The correct answer is "+LETTERS[q.answer]+". "+q.correctText
        :ok?"Correct.":"Wrong — the correct answer is "+LETTERS[q.answer]+". "+q.correctText));
      if(q.steps&&q.steps.length)det.append(el("ol",{class:"steps"},q.steps.map(x=>el("li",null,x))));
      if(sel!=null&&!ok){
        const key=si+":"+qi;
        if(!mock.reviewTagged.has(key)){
          const chips=causeChips(s.def.id,()=>{mock.reviewTagged.add(key)});
          det.append(chips);
        }
      }
      rg.append(det);
    });
  });
  a.append(rg);
  a.append(el("div",{class:"actions"},el("button",{class:"btn",onclick:()=>{mock=null;viewMock()}},"Back to mock intro")));
}
/* ================= DESCRIPTIVE view ================= */
let descTimerEnd=null,descScores={};

      oninput:ev=>{store.drafts[partId]=ev.target.value;saveStore();wc.textContent=wordCount(ev.target.value)+" words"}});
    ta.value=store.drafts[partId]||"";wc.textContent=wordCount(ta.value)+" words";
    g.append(ta,wc);return g;
  };

    el("p",{class:"caption"},"Structure: short introduction, 3–4 body points, brief conclusion.")));
  const precisWords=wordCount(precis.text);
  a.append(mkArea("precis","Part 2 · Précis · 10 marks","“"+precis.title+"” — write about one-third of the passage (passage: "+precisWords+" words, so aim for about "+Math.round(precisWords/3)+" words), "+CONFIG.descriptive.parts[1].minutesGuide,precis.text,
    el("p",{class:"caption"},"Give your précis a title. Keep the author's order and meaning; cut examples and repetition.")));
  const compExtra=el("ol",null,DESCRIPTIVE.comp.questions.map(q=>el("li",null,q.q)));
  a.append(mkArea("comp","Part 3 · Comprehension · 10 marks","Answer all five questions in short answers, "+CONFIG.descriptive.parts[2].minutesGuide,DESCRIPTIVE.comp.passage,compExtra));

  const rg=el("div",{class:"group"});rg.append(el("p",{class:"label"},"Self-score"),el("h2",null,"Rubric — score each part 0, 1 or 2 per criterion"));
  rg.append(el("p",{class:"fact"},"Part score = (criterion total / 8) × 10. Total is out of 30. This is your own rubric self-evaluation, labelled as such — not an exam mark."));

    totalEl.textContent="Self-score so far: "+fmtScore(tot)+" / 30";return tot};
  for(const part of CONFIG.descriptive.parts){
    scoreState[part.id]=[null,null,null,null];

        el("span",{style:"min-width:110px"},crit.name),
        [0,1,2].map(v=>el("button",{class:"chip",onclick:ev=>{scoreState[part.id][ci]=v;
          row.querySelectorAll(".chip").forEach(c=>c.classList.remove("on"));ev.currentTarget.classList.add("on");updTotal();}},String(v))));
      rg.append(row,el("p",{class:"caption"},crit.guide));
    });
  }
  rg.append(totalEl,el("div",{class:"actions"},el("button",{class:"btn primary",onclick:()=>{
    store.descLastScore=updTotal();refreshDescStatus();saveStore();viewDescriptive();}},"Save self-score and update gate status")));
  if(store.descLastScore!=null)rg.append(el("p",{class:"caption"},"Last saved self-score: "+fmtScore(store.descLastScore)+" / 30 · status "+store.descStatus));
  a.append(rg);

  cg.append(el("ul",{class:"rows"},DESCRIPTIVE.comp.questions.map(q=>el("li",null,el("span",null,q.q),el("span",{class:"detail"},q.points)))));

  if(r==="practice")viewPractice();
