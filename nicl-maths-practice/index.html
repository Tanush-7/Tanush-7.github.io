<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex"><title>Maths practice for the NICL AO exam</title>
<meta name="description" content="Step-by-step practice for the Quantitative Aptitude section, with hints, full solutions and a timed mode.">
<style>:root{--page:#fff;--ink:#251f21;--ink2:#585254;--ink4:#c0bebf;--hair:#eae9ea;--teal:#73a89a;--red:#ed313e;--sand:#f4efec}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--page);color:var(--ink);font:16px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
#app{max-width:760px;margin:0 auto;padding:24px 20px 56px}
@media(min-width:768px){#app{padding:36px 36px 72px}}
h1{font:400 28px/1.15 Georgia,"Times New Roman",serif;letter-spacing:-.02em;margin:8px 0}
@media(min-width:768px){h1{font-size:36px}}
h2{font:400 21px/1.25 Georgia,serif;letter-spacing:-.02em;margin:2px 0 12px}
.fact{color:var(--ink2);margin:0 0 12px}.intro{margin:0 0 8px}
.nav{display:flex;flex-wrap:wrap;gap:20px;border-bottom:1px solid var(--hair);margin:16px 0 8px}
.nav a{display:inline-flex;align-items:center;min-height:44px;color:var(--ink2);text-decoration:none}
.nav a[aria-current=page]{color:var(--ink);box-shadow:inset 0 -1px 0 var(--ink)}
.group{margin:28px 0}.label{color:var(--ink2);font-size:14px;margin:0 0 2px}
.caption{color:var(--ink2);font-size:13px;margin:8px 0}
.facts{display:grid;grid-template-columns:minmax(0,200px) 1fr;gap:0 16px;margin:0}
.facts dt,.facts dd{margin:0;padding:10px 0;border-bottom:1px solid var(--hair)}.facts dt{color:var(--ink2)}
@media(max-width:480px){.facts{grid-template-columns:1fr}.facts dt{border:0;padding-bottom:0}}
.rows{list-style:none;margin:0;padding:0}
.rows li{display:flex;justify-content:space-between;gap:16px;padding:12px 0;border-bottom:1px solid var(--hair)}
.rows .detail{display:block;color:var(--ink2);font-size:14px}
.rows .val{color:var(--ink2);text-align:right;flex:none;max-width:45%;font-weight:600}.rows .val.known{color:var(--teal)}
@media(max-width:480px){.rows li{flex-direction:column;gap:4px}.rows .val{text-align:left;max-width:none}}
.callout{border-left:2px solid var(--ink);padding:4px 0 4px 14px;margin:20px 0}.callout p{margin:6px 0}
.callout.warning{background:var(--sand);border:0;border-radius:12px;padding:14px 16px}
.btn{font:inherit;min-height:44px;padding:0 18px;border-radius:12px;border:1px solid var(--hair);background:var(--page);color:var(--ink);cursor:pointer}
.btn.primary{background:#4f3a37;border-color:#4f3a37;color:#fff}.btn:disabled{opacity:.4;cursor:default}
.actions{display:flex;flex-wrap:wrap;gap:10px;margin:14px 0}
.linkish{font:inherit;background:none;border:0;color:var(--ink2);text-decoration:underline;cursor:pointer;min-height:44px;padding:0}
.heat{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;max-width:320px}
.cell{aspect-ratio:1;border-radius:4px;background:var(--hair);display:block}
.cell.lv1{background:color-mix(in srgb,var(--teal) 30%,white)}.cell.lv2{background:color-mix(in srgb,var(--teal) 55%,white)}
.cell.lv3{background:var(--teal)}.cell.lv4{background:color-mix(in srgb,var(--teal) 70%,black)}
.topics{display:grid;gap:10px;grid-template-columns:1fr;margin-top:12px}
@media(min-width:700px){.topics{grid-template-columns:1fr 1fr}}
.topic{text-align:left;font:inherit;color:var(--ink);background:var(--page);border:1px solid var(--hair);border-radius:12px;padding:14px 16px;min-height:44px;display:grid;gap:4px;cursor:pointer}
.topic:hover,.topic:focus-visible{border-color:var(--ink2)}.tn{font-weight:600}.detail{color:var(--ink2);font-size:14px}.ts{color:var(--ink2);font-size:13px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}
.chip{font:inherit;border:1px solid var(--hair);background:var(--page);color:var(--ink);border-radius:999px;padding:0 16px;min-height:44px;cursor:pointer}
.chip.on{border-color:var(--teal);box-shadow:inset 0 0 0 1px var(--teal);font-weight:600}
.qtext{font-size:18px;line-height:1.5;margin:8px 0 16px;white-space:pre-line}
.opts{display:grid;gap:10px}
.opt{display:flex;gap:12px;align-items:center;text-align:left;font:inherit;font-size:16px;color:var(--ink);background:var(--page);border:1px solid var(--hair);border-radius:12px;padding:12px 14px;min-height:48px;cursor:pointer}
.opt:disabled{cursor:default}.ol{width:28px;height:28px;flex:none;border-radius:50%;border:1px solid var(--hair);display:inline-flex;align-items:center;justify-content:center;font-size:13px;color:var(--ink2)}
.opt.sel{border-color:var(--teal);box-shadow:inset 0 0 0 1px var(--teal)}
.opt.right{border-color:var(--teal);background:color-mix(in srgb,var(--teal) 14%,white);font-weight:600}
.opt.wrong{border-color:var(--red);box-shadow:inset 0 0 0 1px var(--red)}
.timer{font-variant-numeric:tabular-nums;font-weight:600;margin:0}.timer.low{color:var(--red)}
.steps{margin:6px 0 0;padding-left:22px;color:var(--ink)}.steps li{padding:6px 0 6px 4px;border-bottom:1px solid var(--hair)}
.review{border-top:1px solid var(--hair);padding:10px 0}.review summary{cursor:pointer;display:flex;gap:10px;align-items:flex-start;min-height:44px}.review summary span{white-space:pre-line}
.dot{width:10px;height:10px;border-radius:50%;margin-top:7px;flex:none;background:var(--ink4)}.dot.ok{background:var(--teal)}.dot.bad{background:var(--red)}
.codebox{width:100%;font:12px/1.4 ui-monospace,monospace;color:var(--ink);border:1px solid var(--hair);border-radius:8px;padding:10px;margin-top:8px;word-break:break-all}
footer{color:var(--ink2);margin-top:40px;font-size:14px}
a{color:var(--ink)}
